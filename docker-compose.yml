services:
    app:
        build: .
        ports: 
            - "8000:8000"
        environment:
            - DATABASE_URL=postgresql://user:password@db:5432/appdb
            - REDIS_URL=redis://cache:6379
        depends_on:
            - db
            - cache
    db: 
        image: postgres:16
        environment: 
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=appdb
        volumes:
            - pgdata:/var/lib/postgresql/data
    cache:
        image: redis:7

volumes:
    pgdata: 
