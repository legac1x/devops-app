services:
    app:
        build: .
        ports: 
            - "8000:8000"
        environment:
            - DATABASE_URL=postgresql://user:password@db:5432/appdb
            - REDIS_URL=redis://cache:6379
        depends_on:
            db:
                condition: service_healthy
            cache:
                condition: service_healthy
    db: 
        image: postgres:16
        environment: 
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=appdb
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "--dbname", "appdb", "--username", "user"]
            interval: 5s
            timeout: 3s
            retries: 5
    cache:
        image: redis:7
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    pgdata: 
