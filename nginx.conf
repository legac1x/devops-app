server {
    listen 80;
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://logger:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
    }
}
